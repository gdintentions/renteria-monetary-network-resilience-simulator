[project]
name = "renteria-evidenceweave"
version = "0.1.0"
description = "Conflict-aware multimodal evidence intelligence with explainable provenance scoring."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Jason-Benjamin Renteria"}]
dependencies = [
  "streamlit>=1.40,<2",
  "plotly>=5.24,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.8,<1"]
pdf = ["pypdf>=5,<7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/evidenceweave"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

