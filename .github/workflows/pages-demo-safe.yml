name: Deploy Demo-Safe Showcase

on:
  push:
    branches: [main]
    paths:
      - "hosted_demo/**"
      - ".github/workflows/pages-demo-safe.yml"
      - "portfolio_projects/renteria-tracelens/**"
      - "portfolio_projects/renteria-continuity-router/**"
      - "portfolio_projects/renteria-sourcegate/**"
      - "reliability_lab/**"
      - "reliability_tests/**"
      - "scripts/*reliability*"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify static showcase
        run: |
          node --test hosted_demo/rag-demo.test.cjs
          test -f hosted_demo/index.html
          test -f hosted_demo/styles.css
          test -f hosted_demo/app.js
          test -f hosted_demo/rag-demo.js
          python - <<'PY'
          from pathlib import Path
          html=Path("hosted_demo/index.html").read_text()
          js=Path("hosted_demo/app.js").read_text()
          required=["governed-rag","polyglot-relay","context-atlas","monetary-simulator","boundary"]
          missing=[x for x in required if x not in html]
          assert not missing, missing
          assert "Translation unavailable in this demo-safe fixture." in js
          assert "56.70" in html and "89.2" in html
          print("static showcase verification: PASS")
          PY
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify exact Python cores
        run: python scripts/verify_reliability.py
      - run: npm ci --prefix reliability_lab --ignore-scripts
      - run: python scripts/build_reliability_browser.py
      - run: npm install --prefix /tmp/reliability-browser playwright@1.51.1
      - run: /tmp/reliability-browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Gate deployment on actual Python browser flows
        run: node scripts/reliability_browser_smoke.cjs
        env:
          NODE_PATH: /tmp/reliability-browser/node_modules
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reliability-pages-acceptance
          path: artifacts/reliability/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v5
        with:
          path: hosted_demo

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
