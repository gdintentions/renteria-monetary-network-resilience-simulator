name: Monetary Validation

on:
  workflow_dispatch:
  push:
    paths:
      - "simulator.py"
      - "demo/hardening.py"
      - "demo/validation.py"
      - ".github/workflows/monetary-validation.yml"

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m demo.validation
      - uses: actions/upload-artifact@v4
        with:
          name: monetary-validation
          path: |
            docs/evaluations/MONETARY_VALIDATION.md
            artifacts/monetary_validation.json
      - name: Publish validation results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/evaluations/MONETARY_VALIDATION.md artifacts/monetary_validation.json
          git diff --cached --quiet && exit 0
          git commit -m "eval: publish monetary validation results [skip ci]"
          git pull --rebase origin main
          git push
