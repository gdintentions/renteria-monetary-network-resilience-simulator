name: ArgusLoop Tests

on:
  push:
    paths:
      - "portfolio_projects/renteria-argusloop/**"
      - ".github/workflows/argusloop-tests.yml"
  pull_request:
    paths:
      - "portfolio_projects/renteria-argusloop/**"
      - ".github/workflows/argusloop-tests.yml"

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: portfolio_projects/renteria-argusloop
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: portfolio_projects/renteria-argusloop/pyproject.toml
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check .
      - run: python -m pytest
