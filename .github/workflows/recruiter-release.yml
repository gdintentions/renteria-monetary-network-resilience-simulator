name: Synthetic recruiter release
on:
  push:
    paths: ["hosted_demo/**", "scripts/recruiter_browser_smoke.cjs", ".github/workflows/recruiter-release.yml"]
  pull_request:
    paths: ["hosted_demo/**", "scripts/recruiter_browser_smoke.cjs", ".github/workflows/recruiter-release.yml"]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --check hosted_demo/app.js
      - run: node --test hosted_demo/rag-demo.test.cjs
      - run: npm install --prefix /tmp/recruiter-test playwright@1.62.1
      - run: /tmp/recruiter-test/node_modules/.bin/playwright install --with-deps chromium
      - run: node scripts/recruiter_browser_smoke.cjs
        env:
          NODE_PATH: /tmp/recruiter-test/node_modules
      - uses: actions/upload-artifact@v4
        with:
          name: synthetic-rag-mobile-preview
          path: /tmp/rag-recruiter-mobile.png
