name: Capture recruiter demo screenshot

on:
  push:
    branches: [main]
    paths:
      - "demo/**"
      - "simulator.py"
      - "requirements.txt"
      - ".github/workflows/capture-demo-screenshot.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: monetary-screenshot-main
  cancel-in-progress: true

jobs:
  screenshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: |
          pip install -r requirements.txt
          pip install playwright
          python -m playwright install --with-deps chromium
      - run: |
          mkdir -p docs/screenshots
          nohup streamlit run demo/recruiter_app.py --server.headless true --server.address 127.0.0.1 --server.port 8501 >/tmp/streamlit.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:8501 >/dev/null && break; sleep 2; done
      - run: |
          python - <<'PY'
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              browser = p.chromium.launch()
              page = browser.new_page(viewport={"width": 1440, "height": 1000})
              page.goto("http://127.0.0.1:8501", wait_until="networkidle")
              page.screenshot(path="docs/screenshots/recruiter-demo.png", full_page=True)
              browser.close()
          PY
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots/recruiter-demo.png
          git diff --cached --quiet && exit 0
          git commit -m "docs: refresh recruiter demo screenshot [skip ci]"
          git pull --rebase origin main
          git push
