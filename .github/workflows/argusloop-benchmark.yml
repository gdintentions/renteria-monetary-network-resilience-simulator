name: ArgusLoop Controlled Benchmark

on:
  workflow_dispatch:
  push:
    paths:
      - "portfolio_projects/renteria-argusloop/src/**"
      - "portfolio_projects/renteria-argusloop/scripts/controlled_benchmark.py"
      - ".github/workflows/argusloop-benchmark.yml"

permissions:
  contents: write

jobs:
  benchmark:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: portfolio_projects/renteria-argusloop
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev]"
      - run: python scripts/controlled_benchmark.py
      - uses: actions/upload-artifact@v4
        with:
          name: argusloop-controlled-benchmark
          path: |
            portfolio_projects/renteria-argusloop/docs/CONTROLLED_BENCHMARK.md
            portfolio_projects/renteria-argusloop/artifacts/controlled-benchmark.json
      - name: Publish benchmark results
        working-directory: ${{ github.workspace }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add portfolio_projects/renteria-argusloop/docs/CONTROLLED_BENCHMARK.md portfolio_projects/renteria-argusloop/artifacts/controlled-benchmark.json
          git diff --cached --quiet && exit 0
          git commit -m "eval: publish ArgusLoop benchmark results [skip ci]"
          git pull --rebase origin main
          git push
