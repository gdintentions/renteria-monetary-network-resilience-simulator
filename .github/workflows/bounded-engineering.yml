name: Bounded engineering recovery
on: [push, pull_request]
permissions:
  contents: read
jobs:
  recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        project: ['monetary-simulator', 'tracelens', 'continuity-router', 'sourcegate', 'evidenceweave', 'argusloop', 'qrcn']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install "pydantic>=2.9,<3"
      - run: python engineering.py --project "${{ matrix.project }}" --output-dir "artifacts/ci-engineering/${{ matrix.project }}" --source-revision "${{ github.sha }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: engineering-${{ matrix.project }}
          path: artifacts/ci-engineering/
