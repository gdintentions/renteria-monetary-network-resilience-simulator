name: QRCN Phase 3 PQC experiment
on:
  push:
    paths:
      - 'portfolio_projects/qrcn/scripts/run_pqc.py'
      - 'portfolio_projects/qrcn/requirements-pqc-experiment.txt'
      - 'portfolio_projects/qrcn/tests/test_pqc_optional.py'
      - '.github/workflows/qrcn-pqc.yml'
  pull_request:
    paths:
      - 'portfolio_projects/qrcn/scripts/run_pqc.py'
      - 'portfolio_projects/qrcn/requirements-pqc-experiment.txt'
      - 'portfolio_projects/qrcn/tests/test_pqc_optional.py'
      - '.github/workflows/qrcn-pqc.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  local-crypto:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install isolated PQC experiment dependency
        run: python -m pip install -r portfolio_projects/qrcn/requirements-pqc-experiment.txt
      - name: Run NIST-standard-algorithm API tests
        run: cd portfolio_projects/qrcn && python -m unittest discover -s tests -p 'test_pqc_optional.py' -v
      - name: Capture local crypto API experiment results
        run: cd portfolio_projects/qrcn && python -m scripts.run_pqc > pqc-phase3.json
      - uses: actions/upload-artifact@v4
        if: matrix.python-version == '3.11'
        with:
          name: qrcn-phase3-pqc-evidence
          path: portfolio_projects/qrcn/pqc-phase3.json
