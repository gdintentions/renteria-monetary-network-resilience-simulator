name: EvidenceWeave External Conflict Evaluation

on:
  workflow_dispatch:
  push:
    paths:
      - "portfolio_projects/renteria-evidenceweave/src/evidenceweave/**"
      - ".github/workflows/evidenceweave-external-eval.yml"

permissions:
  contents: write

jobs:
  conflictqa:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: portfolio_projects/renteria-evidenceweave
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev]"
      - run: python -m evidenceweave.external_eval
      - uses: actions/upload-artifact@v4
        with:
          name: evidenceweave-conflictqa-evaluation
          path: |
            portfolio_projects/renteria-evidenceweave/docs/CONFLICTQA_EXTERNAL_EVAL.md
            portfolio_projects/renteria-evidenceweave/artifacts/conflictqa-external-eval.json
      - name: Publish evaluation results
        working-directory: ${{ github.workspace }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add portfolio_projects/renteria-evidenceweave/docs/CONFLICTQA_EXTERNAL_EVAL.md portfolio_projects/renteria-evidenceweave/artifacts/conflictqa-external-eval.json
          git diff --cached --quiet && exit 0
          git commit -m "eval: publish ConflictQA results [skip ci]"
          git pull --rebase origin main
          git push
