name: EvidenceWeave Schema Challenger Replay

on:
  pull_request:
    paths:
      - "portfolio_projects/renteria-evidenceweave/**"
      - ".github/workflows/evidenceweave-challenger.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  challenger:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: portfolio_projects/renteria-evidenceweave
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install local project
        run: python -m pip install -e ".[dev]"
      - name: Run test suite and static checks
        run: |
          python -m ruff check .
          python -m pytest -q
      - name: Replay on historical exposed misses (not independent)
        run: python challenger_schema_replay.py
      - name: Run paired synthetic semantic benchmark
        run: python semantic_development_eval.py
      - name: Validate both confusion matrices and published scope
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("artifacts/semantic-challenger-development.json").read_text())
          assert len(data["cases"]) == 8
          assert sum(data["baseline"].values()) == 8
          assert sum(data["challenger"].values()) == 8
          assert "author-labeled" in data["scope"]
          print("Synthetic comparison only:", data["baseline"], data["challenger"])
          PY
      - name: Run separated-label evaluation protocol (DEVELOPER fixtures only)
        run: |
          python blinded_pair_eval.py \
            --cases data/protocol_demo/cases.dev.json \
            --labels data/protocol_demo/labels.dev.json \
            --config data/protocol_demo/schema.dev.json \
            --out artifacts/separated-label-development.json
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("artifacts/separated-label-development.json").read_text())
          assert d["count"] == 8
          assert d["label_provenance_status"] == "NOT_INDEPENDENTLY_VERIFIED"
          assert d["exact_key"]["tp"] == 1
          assert d["semantic_challenger"]["tp"] == 3
          print("Development-only separate-label run:", d["exact_key"], d["semantic_challenger"])
          PY
      - name: Assert no accuracy overclaim
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path("artifacts/challenger-schema-replay.json").read_text())
          assert x["misses_inspected"] == 258
          assert x["full_test_precision"] is None
          assert x["full_test_recall"] is None
          assert x["historical_recall"] == 0.4
          assert "No external accuracy improvement" in x["claim"]
          print("Replayed historical misses with explicit limitations.")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: evidenceweave-challenger-${{ github.sha }}
          path: |
            portfolio_projects/renteria-evidenceweave/artifacts/challenger-schema-replay.json
            portfolio_projects/renteria-evidenceweave/artifacts/semantic-challenger-development.json
            portfolio_projects/renteria-evidenceweave/artifacts/separated-label-development.json
          retention-days: 90
