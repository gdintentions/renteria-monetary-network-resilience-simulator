name: QRCN research prototype tests
on:
  push:
    paths:
      - 'portfolio_projects/qrcn/**'
      - 'hosted_demo/qrcn/**'
      - '.github/workflows/qrcn-tests.yml'
  pull_request:
    paths:
      - 'portfolio_projects/qrcn/**'
      - 'hosted_demo/qrcn/**'
      - '.github/workflows/qrcn-tests.yml'
  workflow_dispatch:
jobs:
  python-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Core unit tests
        run: cd portfolio_projects/qrcn && python -m unittest discover -s tests -v
      - name: Scenario output
        run: cd portfolio_projects/qrcn && python -m scripts.run_demo > qrcn-scenarios.json
      - name: Durable SQLite recovery and split-brain evidence
        run: cd portfolio_projects/qrcn && python -m scripts.run_phase2 > qrcn-phase2.json
      - name: Quorum simulation evidence
        run: cd portfolio_projects/qrcn && python -m scripts.run_phase3 > qrcn-phase3.json
      - name: Phase 4 independent acceptor scenario
        run: cd portfolio_projects/qrcn && python -m scripts.run_phase4 > qrcn-phase4.json
      - name: Compile source
        run: cd portfolio_projects/qrcn && python -m compileall -q qrcn tests scripts
      - uses: actions/upload-artifact@v4
        if: matrix.python-version == '3.11'
        with:
          name: qrcn-scenario-evidence
          path: |
            portfolio_projects/qrcn/qrcn-scenarios.json
            portfolio_projects/qrcn/qrcn-phase2.json
            portfolio_projects/qrcn/qrcn-phase3.json
            portfolio_projects/qrcn/qrcn-phase4.json
