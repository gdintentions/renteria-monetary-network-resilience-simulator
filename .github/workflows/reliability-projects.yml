name: Reliability project acceptance
on:
  push:
    paths: ['portfolio_projects/renteria-tracelens/**', 'portfolio_projects/renteria-continuity-router/**', 'portfolio_projects/renteria-sourcegate/**', 'reliability_lab/**', 'reliability_tests/**', 'hosted_demo/reliability/**', 'scripts/*reliability*', '.github/workflows/reliability-projects.yml']
  pull_request:
    paths: ['portfolio_projects/renteria-tracelens/**', 'portfolio_projects/renteria-continuity-router/**', 'portfolio_projects/renteria-sourcegate/**', 'reliability_lab/**', 'reliability_tests/**', 'hosted_demo/reliability/**', 'scripts/*reliability*', '.github/workflows/reliability-projects.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python scripts/verify_reliability.py
      - run: npm ci --prefix reliability_lab --ignore-scripts
      - run: python scripts/build_reliability_browser.py
      - run: npm install --prefix /tmp/reliability-browser playwright@1.51.1
      - run: /tmp/reliability-browser/node_modules/.bin/playwright install --with-deps chromium
      - run: node scripts/reliability_browser_smoke.cjs
        env:
          NODE_PATH: /tmp/reliability-browser/node_modules
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reliability-acceptance-python-${{ matrix.python }}
          path: artifacts/reliability/
